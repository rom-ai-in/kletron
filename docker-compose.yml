# Kletron local infrastructure — start MongoDB for dev/tests.
# Usage:
#   docker compose up -d mongo
# Optional smoke profile (production-like images; needs .env and build context):
#   docker compose --profile fullstack up -d --build

services:
  mongo:
    image: mongo:7
    container_name: kletron-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - kletron_mongo_data:/data/db
    networks:
      - kletron-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Optional: production-like images (requires `docker compose --profile fullstack up --build`
  # and a populated `.env` for NextAuth / LLM — see README).
  mcp-server:
    profiles: ["fullstack"]
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    container_name: kletron-mcp
    restart: unless-stopped
    ports:
      - "9000:8080"
    environment:
      NODE_ENV: production
      MCP_TRANSPORT: sse
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN:-change-me-long-random-token}
      KLETRON_WEB_BASE_URL: ${KLETRON_WEB_BASE_URL:-http://web:3000}
    networks:
      - kletron-net
    depends_on:
      mongo:
        condition: service_healthy

  web:
    profiles: ["fullstack"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        MONGODB_URI_BUILD: mongodb://mongo:27017/kletron
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: kletron-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/kletron
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-development-only-change-me-32chars-min}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN:-change-me-long-random-token}
      AUTH_TRUST_HOST: "true"
    networks:
      - kletron-net
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  kletron_mongo_data:

networks:
  kletron-net:
    name: kletron-net
