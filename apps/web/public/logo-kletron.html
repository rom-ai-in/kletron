<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kletron</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.35em;
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      user-select: none;
    }
    .emoji {
      font-size: 1.15em;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="logo" aria-label="kletron">
    <span class="emoji" role="img" aria-hidden="true">🧠</span>
    <span>kletron</span>
  </div>
</body>
</html>
