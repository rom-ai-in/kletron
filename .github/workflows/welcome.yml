name: Welcome first-time contributors

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue! Maintainers try to respond within **48 hours**. If this is security-sensitive, close this and see **SECURITY.md** instead.
