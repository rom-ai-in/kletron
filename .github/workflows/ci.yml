name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        # `--legacy-peer-deps` is required because @langchain/anthropic@1.3.13 pins
        # a `@langchain/core@1.1.18` peer that conflicts with the >=1.1.47 peer
        # pulled in by @langchain/google-vertexai for the Vertex provider. Runtime
        # is fine; only the strict resolver complains.
        run: npm ci --legacy-peer-deps

      - name: Lint (informational)
        continue-on-error: true
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build UI package
        run: npm run build:ui

      # Full monorepo typecheck — re-enable as a hard gate when root is green.
      - name: Typecheck (informational)
        continue-on-error: true
        run: npm run typecheck
