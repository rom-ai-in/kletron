# Cloud Build only (pas de déclencheur GitHub). Images Artifact Registry + déploiement Cloud Run.
# URL web typique après création: https://kletron-web-XXXXX.europe-west6.run.app (suffixe attribué par Google).
#
# Déploiement: ./infra/gcp/deploy.sh (avec NEXT_PUBLIC_APP_URL=…).
# Ne pas passer _NEXT_PUBLIC_APP_URL via `gcloud --substitutions=…` avec une URL https:// : le CLI
# casse sur les « : ». deploy.sh réécrit les clés `substitutions:` dans un YAML temporaire.

substitutions:
  _REGION: europe-west6
  _AR_REPO: kletron
  _WEB_SERVICE: kletron-web
  _MCP_SERVICE: kletron-mcp
  _EXPECTED_PROJECT: kletron
  _ALLOW_NON_KLETRON_PROJECT: "false"
  _NEXT_PUBLIC_APP_URL: https://change-me-after-first-deploy.run.app
  # Vertex AI (Gemini Enterprise)
  _VERTEX_LOCATION: us-central1
  _VERTEX_MODEL: gemini-2.5-pro

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: validate-target
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        # Bash locals must not mimic Cloud Build substitution syntax like _foo.
        pid_lc="$(printf '%s' "$PROJECT_ID" | tr '[:upper:]' '[:lower:]')"
        if [[ "$pid_lc" == *numezis* ]]; then
          echo "Refusing Cloud Build: PROJECT_ID '$PROJECT_ID' matches Kletron-only policy (numezis forbidden)."
          exit 2
        fi
        if [[ "$PROJECT_ID" != "${_EXPECTED_PROJECT}" && "${_ALLOW_NON_KLETRON_PROJECT}" != "true" ]]; then
          echo "Refusing Cloud Build rollout to project '$PROJECT_ID'. Expected '${_EXPECTED_PROJECT}'."
          echo "Override explicitly only if intentional with _ALLOW_NON_KLETRON_PROJECT=true."
          exit 1
        fi

  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_NEXT_PUBLIC_APP_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_WEB_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_WEB_SERVICE}:latest
      - .

  # Les images de la section `images:` ne sont poussées qu'après *toutes* les étapes :
  # il faut pousser avant deploy vers Cloud Run.
  - id: push-web
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_WEB_SERVICE}:$BUILD_ID

  - id: build-mcp
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/mcp-server/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_MCP_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_MCP_SERVICE}:latest
      - .

  - id: push-mcp
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_MCP_SERVICE}:$BUILD_ID

  - id: deploy-mcp
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_MCP_SERVICE}
      - --project=$PROJECT_ID
      - --region=${_REGION}
      - --platform=managed
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_MCP_SERVICE}:$BUILD_ID
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --set-env-vars=NODE_ENV=production,MCP_TRANSPORT=sse

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        MCP_SSE="$(gcloud run services describe ${_MCP_SERVICE} --project="$PROJECT_ID" --region="${_REGION}" --format='value(status.url)')/sse"
        {
          echo "NODE_ENV: production"
          echo 'NEXT_TELEMETRY_DISABLED: "1"'
          printf 'AUTH_TRUST_HOST: "%s"\n' "true"
          printf 'MCP_URL: "%s"\n' "$${MCP_SSE}"
          printf 'NEXT_PUBLIC_APP_URL: "%s"\n' "${_NEXT_PUBLIC_APP_URL}"
          printf 'NEXTAUTH_URL: "%s"\n' "${_NEXT_PUBLIC_APP_URL}"
          # Vertex AI auto-detect: with these set, Kletron's Vertex provider
          # uses Application Default Credentials from the Cloud Run service
          # account. No service-account JSON in the image.
          printf 'GOOGLE_CLOUD_PROJECT: "%s"\n' "$PROJECT_ID"
          printf 'GOOGLE_CLOUD_LOCATION: "%s"\n' "${_VERTEX_LOCATION}"
          printf 'VERTEX_MODEL: "%s"\n' "${_VERTEX_MODEL}"
        } > /tmp/kletron-web-env.yaml
        RUN_SECRETS="NEXTAUTH_SECRET=kletron-nextauth-secret:latest,MONGODB_URI=kletron-mongodb-uri:latest,GOOGLE_OAUTH_CLIENT_ID=kletron-google-oauth-client-id:latest,AZURE_OPENAI_API_KEY=kletron-azure-openai-api-key:latest,TAVILY_API_KEY=kletron-tavily-api-key:latest,LANGSMITH_API_KEY=kletron-langsmith-api-key:latest"
        if gcloud secrets describe kletron-google-oauth-client-secret --project="$PROJECT_ID" &>/dev/null; then
          RUN_SECRETS="$${RUN_SECRETS},GOOGLE_OAUTH_CLIENT_SECRET=kletron-google-oauth-client-secret:latest"
        fi
        if gcloud secrets describe kletron-channel-telegram-bot-token --project="$PROJECT_ID" &>/dev/null; then
          RUN_SECRETS="$${RUN_SECRETS},CHANNEL_TELEGRAM_BOT_TOKEN=kletron-channel-telegram-bot-token:latest"
        fi
        if gcloud secrets describe kletron-channel-telegram-webhook-secret --project="$PROJECT_ID" &>/dev/null; then
          RUN_SECRETS="$${RUN_SECRETS},CHANNEL_TELEGRAM_WEBHOOK_SECRET=kletron-channel-telegram-webhook-secret:latest"
        fi
        if gcloud secrets describe kletron-channel-secrets-key --project="$PROJECT_ID" &>/dev/null; then
          RUN_SECRETS="$${RUN_SECRETS},KLETRON_CHANNEL_SECRETS_KEY=kletron-channel-secrets-key:latest"
        fi
        gcloud run deploy ${_WEB_SERVICE} \
          --project="$PROJECT_ID" \
          --region="${_REGION}" \
          --platform=managed \
          --image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_WEB_SERVICE}:$BUILD_ID" \
          --allow-unauthenticated \
          --port=3000 \
          --memory=2Gi \
          --cpu=2 \
          --min-instances=0 \
          --max-instances=10 \
          --env-vars-file=/tmp/kletron-web-env.yaml \
          --set-secrets="$${RUN_SECRETS}"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_WEB_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_MCP_SERVICE}:$BUILD_ID
