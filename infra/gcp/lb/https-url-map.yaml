# Classic external HTTPS load balancer URL map (import with envsubst).
# Apex redirects to www; all other hosts use default backend (Cloud Run).
kind: compute#urlMap
name: kletron-https-url-map
defaultService: projects/${PROJECT_ID}/global/backendServices/kletron-www-backend
hostRules:
  - hosts:
      - kletron.com
    pathMatcher: apex-to-www
pathMatchers:
  - name: apex-to-www
    defaultUrlRedirect:
      redirectResponseCode: MOVED_PERMANENTLY_DEFAULT
      httpsRedirect: true
      hostRedirect: www.kletron.com
